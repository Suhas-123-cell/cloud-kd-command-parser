# Parallel teacher labelling: an Indexed Job runs SHARD_COUNT Pods at the same time,
# each with its own SHARD_INDEX (0..SHARD_COUNT-1) taken from the Job completion index.
apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-label
  namespace: pipeline
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimitPerIndex: 3
  template:
    metadata:
      labels: {app: teacher-worker}
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: cc-kd/worker:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            # Ollama (phi3.5) runs on the laptop; Docker Desktop routes host.docker.internal to it.
            - {name: OLLAMA_URL, value: "http://host.docker.internal:11434"}
            - {name: INPUT_URI, value: "s3://datasets/commands_pool.jsonl"}
            - {name: OUTPUT_PREFIX, value: "s3://datasets/teacher/"}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
