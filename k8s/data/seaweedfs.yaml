# SeaweedFS (master + volume + filer + S3 gateway in one process) in namespace "data".
# S3 credentials come from Secret seaweedfs-s3-config (created by scripts/secrets.sh, never committed).
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
  labels: {app: seaweedfs}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=512
            - -volume.max=20
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
          ports:
            - {name: s3, containerPort: 8333}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3-config
          secret: {secretName: seaweedfs-s3-config}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
spec:
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
---
# Exposed on the k3d node as 30333, which cluster/k3d.yaml maps to 127.0.0.1:8333 on the host.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-external
  namespace: data
spec:
  type: NodePort
  selector: {app: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333, nodePort: 30333}
