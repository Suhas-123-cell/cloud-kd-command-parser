# Command-parser service in namespace "app": Deployment + Service + Ingress + HPA.
# S3 credentials come from Secret s3-credentials (created by scripts/secrets.sh).
apiVersion: v1
kind: Namespace
metadata:
  name: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: app
  labels: {app: parser}
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # never drop below the current Ready count during an update
  selector:
    matchLabels: {app: parser}
  template:
    metadata:
      labels: {app: parser}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: parser
          image: cc-kd/parser:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: MODEL_URI, value: "s3://models/v1/"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - {name: FAULT_INJECT, value: "0"}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
          envFrom:
            - secretRef: {name: s3-credentials}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 1
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              # keep serving while the endpoint is removed from the Service/Ingress,
              # so in-flight and just-routed requests are not cut off during rollouts
              exec: {command: ["sleep", "5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: parser
  namespace: app
spec:
  selector: {app: parser}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: parser
                port: {name: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: parser
  namespace: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: parser
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default is 300 s; shortened so the scale-down is observable
